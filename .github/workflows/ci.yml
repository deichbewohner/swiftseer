name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: make test

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test ./...

  build-cross:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          CGO_ENABLED: "0"
        run: |
          make build GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }}
          if [ "${{ matrix.target.goos }}" = "windows" ]; then
            ext=".exe"
          else
            ext=""
          fi
          mkdir -p dist
          cp "bin/swiftseer$ext" "dist/swiftseer_${{ matrix.target.goos }}_${{ matrix.target.goarch }}$ext"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.goos }}_${{ matrix.target.goarch }}
          path: dist/*
